CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610_ALT=y

# Delay the sensor power-up sequence past the nice!nano ext-power rail settling.
# Without this the driver reads the product id at ~610ms and gets 0xff (sensor not
# powered/out of reset yet). Upstream fix for "Incorrect product id 0xFF" on nice_nano_v2:
# https://github.com/badjeff/zmk-pmw3610-driver  (adds to ASYNC_INIT_STEP_POWER_UP delay)
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000
