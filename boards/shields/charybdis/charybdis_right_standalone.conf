CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610_ALT=y

# Debug-build logging volume control.
# ZMK sets ZMK_LOG_LEVEL default 4 (DEBUG), which emits ~6 lines per pointer event
# (apply_config / scale_val / mouse_movement_set / mouse_scroll_set / clear). Over the
# slow USB CDC console that floods the log backend, blocks the logging thread, and the
# keyboard freezes mid-keypress -> the host auto-repeats the key that never got a key-up.
# ZMK_LOGGING_MINIMAL drops ZMK to INFO; the pmw3610 driver stays at DEBUG so we keep its
# one-line-per-event raw sensor delta: LOG_DBG("x/y: %d/%d", x, y).
# Inert in the normal build, which has no logging enabled at all.
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_PMW3610_ALT_LOG_LEVEL_DBG=y

# Bluetooth-mode latency. Scoped to this shield ON PURPOSE: everything here would
# otherwise land in config/charybdis.conf and change the dongle setup too, which is
# stable and not to be disturbed. Nothing below is built into any dongle-mode target.
#
# In standalone this half drives two BLE links off one radio -- central to the left
# half, peripheral to the host -- so trackball reports queue behind split traffic.
# In dongle mode it has a single dedicated link and none of this applies.

# Halves the on-air time of every packet, which is what eases the contention between
# those two links. ZMK sets `BT_CTLR_PHY_2M default n if ZMK_BLE_EXPERIMENTAL_CONN`,
# deliberately trading it away for connection stability -- accepted here, where the
# link is short-range and latency is the thing being chased, and NOT accepted for the
# dongle, which is exactly why this line is not in the shared conf.
CONFIG_BT_CTLR_PHY_2M=y

# Ask the host for a 7.5ms connection interval instead of settling for the 15ms that
# the default max allows. macOS may refuse; it costs nothing to ask.
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
