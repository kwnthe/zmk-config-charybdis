---
include:
# Left keyboard - same for all modes (always peripheral)
- board: nice_nano//zmk
  shield: charybdis_left

# Standalone mode - right keyboard is primary/central
# BT_CTLR_PHY_2M and the 7.5ms interval request go here rather than in a .conf,
# because boards/shields/charybdis/dongle_charybdis_right.conf is a SYMLINK to
# charybdis_right_standalone.conf -- anything written there lands in the dongle-mode
# build too. Only standalone drives two BLE links off one radio and wants this trade;
# the dongle link is stable and ZMK turns PHY_2M off under ZMK_BLE_EXPERIMENTAL_CONN
# on purpose. cmake-args is per-entry, so it cannot leak.
- board: nice_nano//zmk
  shield: charybdis_right_standalone
  snippet: studio-rpc-usb-uart
  cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_BT_CTLR_PHY_2M=y -DCONFIG_BT_PERIPHERAL_PREF_MAX_INT=6

# Kept deliberately: USB-logging variants of both halves. Flash one instead of the
# normal firmware, open the CDC-ACM serial port and watch the log -- "Sending event at
# <row>,<col>" for matrix problems, and the LOG_INF from behavior_trackball_cpi.c /
# input_processor_auto_layer.c for trackball and auto-mouse-layer behaviour. Originally
# added for a dead column (since fixed); useful enough to keep around.
- board: nice_nano//zmk
  shield: charybdis_left
  snippet: zmk-usb-logging
  artifact-name: DEBUG-usb-logging-charybdis_left

- board: nice_nano//zmk
  shield: charybdis_right_standalone
  snippet: zmk-usb-logging
  artifact-name: DEBUG-usb-logging-charybdis_right_standalone

# Dongle mode puts the trackball on a peripheral, so this is the only build that can
# show the sensor-side logging: "Trackball CPI now <n>" from behavior_trackball_cpi.c.
- board: nice_nano//zmk
  shield: dongle_charybdis_right
  snippet: zmk-usb-logging
  artifact-name: DEBUG-usb-logging-dongle_charybdis_right

# Dongle mode - prospector dongle is primary/central with display, right is peripheral
- board: nice_nano//zmk
  shield: dongle_charybdis_right
- board: xiao_ble//zmk
  shield: dongle_prospector prospector_adapter
  snippet: studio-rpc-usb-uart
  cmake-args: -DCONFIG_ZMK_STUDIO=y
# YADS Prospector dongle - disabled pending zmk-dongle-screen Zephyr 4.1 fix
# See: https://github.com/janpfischer/zmk-dongle-screen/issues/29
# - board: xiao_ble
#   shield: dongle_yads_prospector dongle_screen
#   snippet: studio-rpc-usb-uart
#   cmake-args: -DCONFIG_ZMK_STUDIO=y

# Dongle mode - nice_nano dongle with OLED display
- board: nice_nano//zmk
  shield: dongle_nice_32 dongle_display
  snippet: studio-rpc-usb-uart
  cmake-args: -DCONFIG_ZMK_STUDIO=y
- board: nice_nano//zmk
  shield: dongle_nice_64 dongle_display
  snippet: studio-rpc-usb-uart
  cmake-args: -DCONFIG_ZMK_STUDIO=y

# Settings reset for both board types
- board: nice_nano//zmk
  shield: settings_reset
- board: xiao_ble//zmk
  shield: settings_reset

# Tester Pro Micro
- board: nice_nano//zmk # Replace with the Pro Micro-compatible board you're using
  shield: tester_pro_micro
  format: bt
