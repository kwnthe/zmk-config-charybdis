CONFIG_ZMK_KEYBOARD_NAME="K-Keyboard!"

# Pairing without a passkey. Explicitly =n rather than deleted: ZMK's
# BT_SMP_ALLOW_UNAUTH_OVERWRITE carries `imply ZMK_BLE_PASSKEY_ENTRY`, and an imply
# would switch it back on if the line simply went away.
#
# Tradeoff: pairing becomes "just works", so anyone in range while the keyboard is
# advertising can pair with it. Requires being nearby during that window.
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# ZMK Studio: never lock, so an overwritten &studio_unlock key can't lock us out
CONFIG_ZMK_STUDIO_LOCKING=n
